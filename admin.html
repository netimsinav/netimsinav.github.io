<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Netim — Admin</title>
  <style>
    :root {
      --brand:#12A594; --bg:#F7F7F5; --card:#fff; --text:#1a2230;
      --muted:#6b7280; --border:#e5e7eb; --danger:#dc2626; --ok:#16a34a;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#0f1720; --card:#1a2230; --text:#e5e7eb; --muted:#9aa4b2; --border:#2b3547; }
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh}
    .wrap{max-width:920px;margin:0 auto;padding:20px}
    .hidden{display:none!important}
    /* login */
    .login{max-width:360px;margin:60px auto;background:var(--card);border:1px solid var(--border);
      border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.07)}
    .brand{color:var(--brand);font-weight:700;letter-spacing:.5px;font-size:14px;text-align:center;margin-bottom:6px}
    h1{font-size:20px;margin:0 0 18px;text-align:center}
    input{width:100%;padding:12px 14px;margin-bottom:12px;border:1px solid var(--border);
      border-radius:10px;background:transparent;color:var(--text);font-size:15px}
    button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--brand);
      color:#fff;font-size:15px;font-weight:600;cursor:pointer}
    button.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
    .err{color:var(--danger);font-size:14px;margin-bottom:10px;min-height:18px}
    /* header */
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;flex-wrap:wrap}
    .top .actions{display:flex;gap:8px}
    .top button{width:auto;padding:9px 14px;font-size:14px}
    .updated{font-size:12px;color:var(--muted)}
    /* metrics */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:26px}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
    .stat .v{font-size:24px;font-weight:700}
    .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
    /* reports */
    h2{font-size:16px;margin:0 0 12px}
    .rep{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
    .rep .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
    .chip{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(18,165,148,.12);color:var(--brand);font-weight:600}
    .chip.count{background:rgba(220,38,38,.12);color:var(--danger)}
    .q{font-weight:600;margin-bottom:8px;line-height:1.4}
    .opt{padding:6px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:5px;font-size:14px}
    .opt.correct{border-color:var(--ok);background:rgba(22,163,74,.10)}
    .opt.correct::after{content:" ✓";color:var(--ok);font-weight:700}
    .reasons{margin-top:8px;font-size:13px;color:var(--muted)}
    .reasons b{color:var(--text)}
    .empty{color:var(--muted);text-align:center;padding:30px}
    .note{font-size:12px;color:var(--muted);margin-top:6px;font-style:italic}
    .rep .clearBtn{margin-top:12px;width:auto;padding:8px 14px;font-size:13px;
      background:var(--ok);color:#fff;border:none;border-radius:8px;cursor:pointer}
    .rep .clearBtn:disabled{opacity:.6}
  </style>
</head>
<body>
  <!-- GİRİŞ -->
  <div id="login" class="login">
    <div class="brand">NETİM · ADMIN</div>
    <h1>Yönetici Girişi</h1>
    <div id="loginErr" class="err"></div>
    <div id="loginNotice" class="err" style="color:var(--ok)"></div>
    <input id="email" type="email" placeholder="E-posta (netimsinav@gmail.com)" autocomplete="username" />
    <button id="loginBtn">Giriş linki gönder</button>
    <p class="note" style="text-align:center;margin-top:14px">
      E-postana bir giriş linki göndeririz. Şifre gerekmez — linke tıklayınca içeri girersin.
    </p>
  </div>

  <!-- PANEL -->
  <div id="panel" class="wrap hidden">
    <div class="top">
      <div>
        <div class="brand">NETİM · ADMIN</div>
        <div class="updated" id="updated"></div>
      </div>
      <div class="actions">
        <button class="ghost" id="refreshBtn">Yenile</button>
        <button class="ghost" id="logoutBtn">Çıkış</button>
      </div>
    </div>

    <div class="grid" id="metrics"></div>

    <h2>Raporlanan sorular (<span id="repCount">0</span>)</h2>
    <div id="reports"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://kafvqhupsfpbepflzfyf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZnZxaHVwc2ZwYmVwZmx6ZnlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MDYwMTcsImV4cCI6MjA5OTA4MjAxN30.bxaU9B3YdyHvkX2luELC4XLE4vn93AgYu0WvpwTBKvQ";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

    const METRIC_LABELS = [
      ["bugun_yeni","Bugün yeni"], ["bugun_aktif","Bugün aktif (DAU)"],
      ["bugun_ders","Bugün ders"], ["son7_yeni","7 gün yeni"],
      ["son7_aktif","7 gün aktif"], ["geri_donen","Geri dönen"],
      ["kayitli","Kayıtlı kullanıcı"], ["misafir","Misafir"],
      ["toplam_kullanici","Toplam kullanıcı"], ["toplam_ders","Toplam ders"],
      ["pro_abone","Pro abone"], ["toplam_rapor","Toplam rapor"],
    ];

    function showPanel(show){ $("panel").classList.toggle("hidden",!show); $("login").classList.toggle("hidden",show); }

    async function loadData(){
      $("updated").textContent = "yükleniyor…";
      const [{ data: m, error: me }, { data: r, error: re }] = await Promise.all([
        sb.rpc("admin_metrics"),
        sb.rpc("admin_reported_questions"),
      ]);
      if (me || re){
        const msg = (me || re).message || "";
        if (msg.includes("yetkisiz")){
          alert("Bu hesap admin değil. Admin hesabıyla giriş yap.");
          await sb.auth.signOut(); showPanel(false); return;
        }
        $("updated").textContent = "Hata: " + msg; return;
      }
      renderMetrics(m); renderReports(r || []);
      $("updated").textContent = "Güncellendi: " + new Date().toLocaleString("tr-TR");
    }

    function renderMetrics(m){
      $("metrics").innerHTML = METRIC_LABELS.map(([k,l]) =>
        `<div class="stat"><div class="v">${esc(m[k] ?? "0")}</div><div class="l">${l}</div></div>`
      ).join("");
    }

    function renderReports(list){
      $("repCount").textContent = list.length;
      if (!list.length){ $("reports").innerHTML = `<div class="empty">Henüz raporlanan soru yok 🎉</div>`; return; }
      $("reports").innerHTML = list.map((it) => {
        const opts = Array.isArray(it.siklar) ? it.siklar : null;
        let optsHtml = "";
        if (opts){
          optsHtml = opts.map((o,i) => {
            const correct = (typeof it.dogru === "number" && it.dogru === i);
            return `<div class="opt${correct ? " correct" : ""}">${esc(o)}</div>`;
          }).join("");
        }
        // fillblank / metin cevap
        const textAnswer = (typeof it.dogru === "string")
          ? `<div class="opt correct">${esc(it.dogru)}</div>` : "";
        const reasons = Array.isArray(it.sebepler) && it.sebepler.length
          ? `<div class="reasons"><b>Sebepler:</b> ${it.sebepler.map(esc).join(" · ")}</div>` : "";
        const tarih = it.son_rapor ? new Date(it.son_rapor).toLocaleDateString("tr-TR") : "";
        return `<div class="rep">
          <div class="meta">
            <span class="chip count">${esc(it.rapor_sayisi)} rapor</span>
            <span class="chip">${esc(it.ders)}</span>
            <span class="chip">${esc(it.unite)}</span>
            <span class="chip">${esc(it.kicker || it.tip)}</span>
            <span class="updated">son: ${esc(tarih)}</span>
          </div>
          <div class="q">${esc(it.soru)}</div>
          ${optsHtml}${textAnswer}
          ${it.note ? `<div class="note">Açıklama: ${esc(it.note)}</div>` : ""}
          ${reasons}
          <button class="clearBtn" data-ex="${esc(it.exercise_id)}">✓ Çözüldü / Temizle</button>
        </div>`;
      }).join("");
    }

    $("loginBtn").addEventListener("click", async () => {
      $("loginErr").textContent = ""; $("loginNotice").textContent = "";
      const email = $("email").value.trim();
      if (!email){ $("loginErr").textContent = "E-posta gir."; return; }
      $("loginBtn").disabled = true; $("loginBtn").textContent = "Gönderiliyor…";
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: {
          shouldCreateUser: false,               // sadece mevcut hesap giriş linki alır
          emailRedirectTo: window.location.href.split("#")[0], // bu admin sayfasına dön
        },
      });
      $("loginBtn").disabled = false; $("loginBtn").textContent = "Giriş linki gönder";
      if (error){ $("loginErr").textContent = "Gönderilemedi: " + error.message; return; }
      $("loginNotice").textContent = "Giriş linki " + email + " adresine gönderildi. Mailini aç ve linke tıkla.";
    });
    $("email").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
    $("refreshBtn").addEventListener("click", loadData);
    $("logoutBtn").addEventListener("click", async () => { await sb.auth.signOut(); showPanel(false); });

    // Rapor temizleme (event delegation)
    $("reports").addEventListener("click", async (e) => {
      const btn = e.target.closest(".clearBtn");
      if (!btn) return;
      if (!confirm("Bu sorunun raporları temizlensin mi? (Çözüldü / gerek yok)")) return;
      btn.disabled = true; btn.textContent = "Temizleniyor…";
      const { error } = await sb.rpc("admin_clear_reports", { p_exercise_id: btn.getAttribute("data-ex") });
      if (error){
        alert("Hata: " + error.message);
        btn.disabled = false; btn.textContent = "✓ Çözüldü / Temizle";
        return;
      }
      loadData();
    });

    // Oturum kalıcı: sayfayı yeniden açınca hâlâ giriş yapmışsa panele geç.
    (async () => {
      const { data } = await sb.auth.getSession();
      if (data.session){ showPanel(true); loadData(); } else { showPanel(false); }
    })();
  </script>
</body>
</html>
