<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Netim — KPSS & TYT Hazırlık</title>
  <style>
    :root {
      --brand: #12A594; --brand-dark: #0d7d70; --bg: #F7F7F5;
      --card: #ffffff; --text: #1a2230; --muted: #6b7280; --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1720; --card: #1a2230; --text: #e5e7eb;
        --muted: #9aa4b2; --border: #2b3547;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      max-width: 400px; width: 100%; padding: 36px 28px; text-align: center;
      box-shadow: 0 12px 32px rgba(0,0,0,0.08);
    }
    .badge {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%;
      background: rgba(18,165,148,0.12);
      display: flex; align-items: center; justify-content: center;
    }
    .badge svg { width: 40px; height: 40px; stroke: var(--brand); }
    .wordmark { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; color: var(--brand); margin-bottom: 4px; }
    h1 { font-size: 22px; margin: 8px 0 10px; }
    p.sub { font-size: 15px; color: var(--muted); line-height: 1.5; margin: 0 0 26px; }
    .btn {
      display: block; width: 100%; padding: 14px 18px; border-radius: 12px;
      font-size: 16px; font-weight: 600; text-decoration: none; cursor: pointer;
      border: none; margin-bottom: 12px;
    }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-secondary { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
    .hint { font-size: 13px; color: var(--muted); margin-top: 18px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5" />
      </svg>
    </div>
    <div class="wordmark">NETİM</div>
    <h1 id="heading">Netim'e hoş geldin</h1>
    <p class="sub" id="sub">KPSS ve TYT hazırlığını oyunlaştıran uygulama. Kısa derslerle çalış, seri yap, ilerle.</p>
    <a class="btn btn-primary" href="netim://">Uygulamayı Aç</a>
    <a class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.netim.mobile">Google Play'de Aç</a>
    <p class="hint" id="hint">Buton uygulamayı açmazsa, telefonundan Netim uygulamasını açıp giriş yapabilirsin.</p>
  </div>
  <script>
    (function () {
      var h = (window.location.hash || "") + " " + (window.location.search || "");
      if (h.indexOf("type=signup") !== -1 || h.indexOf("access_token") !== -1) {
        document.getElementById("heading").textContent = "E-posta adresin onaylandı ✓";
        document.getElementById("sub").textContent =
          "Netim hesabın hazır. Uygulamaya dönüp e-posta ve şifrenle giriş yapabilirsin.";
      }
    })();
  </script>
</body>
</html>
